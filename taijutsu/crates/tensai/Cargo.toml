version = "0.1.0"
edition = "2024"
description = "SHINOBI — Tensai: découpage sémantique du code (Tree-sitter)"

[dependencies]
domain = { path = "../domain" }

serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
