[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "crates/tensai",
]
resolver = "3"

[package]
name = "taijutsu"
version = "0.1.0"
edition = "2024"
description = "SHINOBI — Moteur central du VCS de nouvelle génération"
license = "MIT"

[[bin]]
name = "taijutsu"
path = "src/main.rs"

# ─────────────────────────────────────────────
# Dépendances du binaire principal (bootstrap)
# ─────────────────────────────────────────────
[dependencies]
domain       = { path = "crates/domain" }
application  = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
presentation = { path = "crates/presentation" }
tensai       = { path = "crates/tensai" }

tokio  = { workspace = true }
axum   = { workspace = true }
tonic  = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# ─────────────────────────────────────────────
# Dépendances centralisées du workspace
# Chaque crate membre pioche ici via { workspace = true }
# ─────────────────────────────────────────────
[workspace.dependencies]
# — Runtime & Async —
tokio = { version = "1.52", features = ["full"] }

# — API REST (Axum) —
axum = { version = "0.8", features = ["macros", "multipart"] }

# — gRPC / Protobuf (Ninpo) —
tonic = { version = "0.14" }
tonic-build = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
tonic-prost = { version = "0.14" }
prost = { version = "0.14" }

# — Base de données (Fūinjutsu) —
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
redis = { version = "1.2", features = ["tokio-comp"] }

# — Moteur VCS —
jj-lib = { version = "=0.41.0", features = ["git"] }

# — Tests —
tempfile = { version = "3" }

# — Async bridge (jj-lib uses async internally) —
pollster = { version = "0.4" }

# — Synchronisation haute performance —
parking_lot = { version = "0.12" }
dashmap = { version = "6" }

# — Async streams (diff_since: StreamExt sur TreeDiffStream) —
futures = { version = "0.3" }

# — Sérialisation —
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# — Observabilité —
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# — Types métier —
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# — Gestion d'erreurs —
thiserror = { version = "2" }
anyhow = { version = "1" }

# — Configuration —
dotenvy = { version = "0.15" }

# — Async trait (compatibilité) —
async-trait = { version = "0.1" }

# — Événementiel (Nen / Kafka) —
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }

# — HTTP Client (Genjutsu / IPFS) —
reqwest = { version = "0.12", features = ["multipart", "json"] }

# — Métriques (Prometheus) —
axum-prometheus = { version = "0.10" }
metrics = { version = "0.24" }

# — Shutdown gracieux (consumer Kafka) —
tokio-util = { version = "0.7", features = ["rt"] }

# — RAG Vectoriel (Phase 7A) —
fastembed = { version = "4" }
pgvector = { version = "0.4", features = ["sqlx"] }

# — Streaming SSE (Phase 15 — Sensei) —
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3" }

# — Text Diff (Phase 17 — Commits & Diff Colorisé) —
similar = { version = "2" }

# — Auth (Phase 19A — Les Portes de Babylone) —
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "9" }
rand = { version = "0.9" }
sha2 = { version = "0.10" }
hex = { version = "0.4" }

# — Fédération (Phase 27 — ForgeFed / ActivityPub) —
rsa = { version = "0.9", features = ["pem", "sha2"] }
pkcs8 = { version = "0.10", features = ["pem"] }
base64 = { version = "0.22" }
url = { version = "2" }

# — Phase 37C — @Mentions (Le Mégaphone) —
pulldown-cmark = { version = "0.12" }
regex = { version = "1" }
