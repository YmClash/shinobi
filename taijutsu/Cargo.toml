[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "crates/tensai",
]
resolver = "3"

[package]
name = "taijutsu"
version = "0.1.0"
edition = "2024"
description = "SHINOBI — Moteur central du VCS de nouvelle génération"
license = "MIT"

[[bin]]
name = "taijutsu"
path = "src/main.rs"

# ─────────────────────────────────────────────
# Dépendances du binaire principal (bootstrap)
# ─────────────────────────────────────────────
[dependencies]
domain       = { path = "crates/domain" }
application  = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
presentation = { path = "crates/presentation" }
tensai       = { path = "crates/tensai" }

tokio  = { workspace = true }
axum   = { workspace = true }
tonic  = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
sqlx = { workspace = true }

# ─────────────────────────────────────────────
# Dépendances centralisées du workspace
# Chaque crate membre pioche ici via { workspace = true }
# ─────────────────────────────────────────────
[workspace.dependencies]
# — Runtime & Async —
tokio = { version = "1.52", features = ["full"] }

# — API REST (Axum) —
axum = { version = "0.8", features = ["macros"] }

# — gRPC / Protobuf (Ninpo) —
tonic = { version = "0.14" }
tonic-build = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
tonic-prost = { version = "0.14" }
prost = { version = "0.14" }

# — Base de données (Fūinjutsu) —
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
redis = { version = "1.2", features = ["tokio-comp"] }

# — Moteur VCS —
jj-lib = { version = "0.41" }

# — Sérialisation —
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# — Observabilité —
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# — Types métier —
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# — Gestion d'erreurs —
thiserror = { version = "2" }
anyhow = { version = "1" }

# — Configuration —
dotenvy = { version = "0.15" }

# — Async trait (compatibilité) —
async-trait = { version = "0.1" }
