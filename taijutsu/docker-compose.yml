# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SHINOBI / Taijutsu — Services de développement
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Usage: docker compose up -d

services:
  # ── Fūinjutsu: PostgreSQL ──────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: shinobi-postgres
    environment:
      POSTGRES_DB: shinobi_dev
      POSTGRES_USER: shinobi
      POSTGRES_PASSWORD: shinobi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shinobi -d shinobi_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Fūinjutsu: Redis ───────────────────────
  redis:
    image: redis:8-alpine
    container_name: shinobi-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Nen: Apache Kafka (KRaft, sans ZooKeeper) ─
  kafka:
    image: apache/kafka:latest
    container_name: shinobi-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=shinobi-kafka-kraft-cluster-01
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Genjutsu: IPFS (Kubo) ──────────────────
  ipfs:
    image: ipfs/kubo:latest
    container_name: shinobi-ipfs
    ports:
      - "4001:4001" # Swarm P2P
      - "127.0.0.1:5001:5001" # RPC API (localhost only — sécurité)
      - "127.0.0.1:8080:8080" # Gateway
    volumes:
      - ipfsdata:/data/ipfs
    healthcheck:
      test: [ "CMD-SHELL", "ipfs id || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Oracle: Ollama (LLM local — code review) ──────────────
  ollama:
    image: ollama/ollama:latest
    container_name: shinobi-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Sensei: Ollama #2 (LLM conversationnel — Phase 15) ────
  # Instance séparée de l'Oracle pour garantir une latence UI < 500ms.
  # Modèle recommandé : qwen2.5-coder:7b (Q4_K_M, ~5GB VRAM)
  # Fallback GPU faible : qwen2.5-coder:3b (Q4_K_M, ~2.5GB VRAM)
  ollama-sensei:
    image: ollama/ollama:latest
    container_name: shinobi-ollama-sensei
    ports:
      - "11436:11434"
    volumes:
      - ollama_sensei_data:/root/.ollama
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  kafkadata:
  ipfsdata:
  ollama_data:
  ollama_sensei_data:
