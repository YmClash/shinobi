# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SHINOBI / Taijutsu — Services de développement
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Usage: docker compose up -d

services:
  # ── Fūinjutsu: PostgreSQL ──────────────────
  postgres:
    image: postgres:17-alpine
    container_name: shinobi-postgres
    environment:
      POSTGRES_DB: shinobi_dev
      POSTGRES_USER: shinobi
      POSTGRES_PASSWORD: shinobi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shinobi -d shinobi_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Fūinjutsu: Redis ───────────────────────
  redis:
    image: redis:8-alpine
    container_name: shinobi-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Nen: Apache Kafka (KRaft, sans ZooKeeper) ─
  kafka:
    image: apache/kafka:latest
    container_name: shinobi-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=shinobi-kafka-kraft-cluster-01
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Genjutsu: IPFS (Kubo) ──────────────────
  ipfs:
    image: ipfs/kubo:latest
    container_name: shinobi-ipfs
    ports:
      - "4001:4001"              # Swarm P2P
      - "127.0.0.1:5001:5001"   # RPC API (localhost only — sécurité)
      - "127.0.0.1:8080:8080"   # Gateway
    volumes:
      - ipfsdata:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs id || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  kafkadata:
  ipfsdata:
