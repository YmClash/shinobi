// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SHINOBI — Protocole Ninpo (gRPC)
// Définitions Protobuf pour le streaming natif
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

syntax = "proto3";

package shinobi.ninpo;

// Service principal du moteur Taijutsu.
// Point d'entrée gRPC pour toutes les opérations VCS.
service ShinobiService {
    // Vérification de la disponibilité du serveur.
    rpc Ping (PingRequest) returns (PingResponse);

    // Créer une nouvelle opération VCS (commit/changement).
    rpc CreateOperation (CreateOperationRequest) returns (OperationResponse);

    // Retrouver une opération par son identifiant.
    rpc GetOperation (GetOperationRequest) returns (OperationResponse);

    // Lister les opérations avec filtrage optionnel.
    rpc ListOperations (ListOperationsRequest) returns (ListOperationsResponse);
}

// ── Messages Ping ──────────────────────────────

message PingRequest {}

message PingResponse {
    string version = 1;
    string status  = 2;
    int64  uptime_seconds = 3;
}

// ── Messages Operation ─────────────────────────

message CreateOperationRequest {
    string author_id   = 1;
    string description = 2;
    // Identifiants des opérations parentes (merge possible).
    repeated string parent_ids = 3;
}

message GetOperationRequest {
    string id = 1;
}

message ListOperationsRequest {
    // Nombre maximum de résultats (défaut: 50).
    int32 limit = 1;
    // Filtre optionnel par auteur (UUID). Vide = pas de filtre.
    string author_id = 2;
}

// ── Réponses Operation ─────────────────────────

message OperationResponse {
    string id          = 1;
    string author_id   = 2;
    string content_id  = 3;
    string description = 4;
    repeated string parent_ids = 5;
    int64  created_at  = 6;
    // CID IPFS distribué (Genjutsu) — vide si non synchronisé.
    optional string ipfs_content_id = 7;
}

message ListOperationsResponse {
    repeated OperationResponse operations = 1;
}
