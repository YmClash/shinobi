[package]
name = "anbu"
version = "0.1.0"
edition = "2024"
description = "ANBU 暗部 — AI Context Capture CLI for SHINOBI"
license = "MIT"
authors = ["YmClash"]
repository = "https://github.com/YmClash/shinobi"
keywords = ["ai", "context", "capture", "vcs"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "anbu"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
colored = "3"
dialoguer = "0.11"

# Filesystem
walkdir = "2"
dirs = "6"

# Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Crypto (hashing)
sha2 = "0.10"
hex = "0.4"

# Storage
rusqlite = { version = "0.34", features = ["bundled"] }

# HTTP client (sync with server)
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }

# Error handling
anyhow = "1"

